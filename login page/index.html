<!DOCTYPE html>
<html lang="en">
<head>

    <title>Login Page</title>
     <link rel="stylesheet"href="styles.css">
</head>
<body>
    <div class="text">
    <h1>Login</h1>
    <h2>
        Enter Email
    </h2>

</div>
<h2>
     Enter Password
    </h2>

    <div class="login-Password">
    <label for="password"></label>
    <input id="password" type="password" placeholder="123456"required>
    <br><br>
    <button>login</button>
</div>
</div>
</body>
</html>
