<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <form>
       
<h1>Job Application Form</h1>

<label for="name">
            Full Name:
</label>
</br>
 <input type="text"
       id="name" 
       name="name"
       placeholder="Enter your name"  required>
       </br>

    <label for="email" >Email:
        </label>
        <br>
        <input type="email"  
        id="email"
        placeholder="Enter your email"required>
        <br>
    
        <label for="position">Position:</label>
        <br>
        <select 
        id="position"
        name="position">
        <option value=""Disabled Selected>Select a Position</option>
       <option value="developer">Developer</option>
       <option value="designer">Designer</option>
       <option value="manager">Manager</option>
       </select>
               
             <fieldset class="radio-group">
                <legend>Availability:
                    </legend>
                    <input type="radio"
                    id="fulltime"
                    value="fulltime"
                    name="availability"
                    checked>
                    <label class="radio-group-1" for="fulltime">Full-Time</label>
                    
     <input type="radio"
    id="parttime"
    value="parttime"
 name="availability" >
            <label class="radio-group-2" for="parttime">Part-Time</label>
                </fieldset>
               
       <label class="your message" for="message">Why do you want this job?
        </label> 
        <textarea class="your message" id="message" name="message" rows="5" cols="60"></textarea>   
        
        <button class="submit-btn" type="submit">Submit Application</button>


       </form>
    </div>
</body>
</html>
